version: 2

models:
  - name: stg_dms__secondary_sales
    description: >
      Secondary sales (distributor -> toko) dari 3 distributor dengan format berbeda, hanya versi file
      terakhir per tanggal bisnis. Kode outlet & produk masih kode lokal distributor (dipetakan di intermediate).
      days_late = tanggal file diterima (WIB) - tanggal invoice.
    columns:
      - name: shipment_line_id
        data_tests: [unique, not_null]
      - name: distributor_code
        data_tests:
          - relationships: {arguments: {to: ref('distributor_master'), field: distributor_code}}
      - name: invoice_date
        data_tests: [not_null]
      - name: outlet_code
        data_tests: [not_null]
      - name: product_code
        data_tests: [not_null]
      - name: uom
        description: PCS atau CASE (karton). Null = satuan tidak dikenal (lihat uom_reported).
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [PCS, CASE]}}
      - name: qty
        data_tests:
          - not_null
          - dbt_utils.accepted_range: {arguments: {min_value: 0, inclusive: false}}
      - name: net_value
        data_tests: [not_null]
      - name: days_late
        data_tests:
          - dbt_utils.accepted_range: {arguments: {min_value: 0}}
